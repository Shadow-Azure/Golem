# Golem - CI Gate
# Triggers on PR create/update and push to main
#
# Gate checks (Go):
# 1. Go format check - gofmt
# 2. Go vet - static analysis
# 3. Go unit tests - go test + coverage
# 4. Go build - build verification
# 5. Security check - hardcoded secrets + dependency audit

name: CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.21'
  GOPROXY: 'https://goproxy.cn,direct'

jobs:
  # ==================== Go Format Check ====================
  go-fmt:
    name: Go Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted:"
            echo "$UNFORMATTED"
            echo ""
            echo "Run 'gofmt -s -w .' to fix"
            exit 1
          fi
          echo "All Go files are properly formatted"

  # ==================== Go Vet ====================
  go-vet:
    name: Go Vet
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run go vet
        run: go vet ./...

  # ==================== Go Unit Tests ====================
  go-test:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: |
          mkdir -p coverage
          go test -v -race -coverprofile=coverage/coverage.out ./...

      - name: Generate coverage report
        if: always()
        run: |
          go tool cover -func=coverage/coverage.out > coverage/coverage-summary.txt

          SUMMARY_FILE="go-coverage-summary.md"
          echo "## Go Test Coverage" > "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          if [ -f coverage/coverage.out ]; then
            TOTAL=$(go tool cover -func=coverage/coverage.out | tail -1 | awk '{print $NF}')
            echo "| Metric | Coverage |" >> "$SUMMARY_FILE"
            echo "|--------|----------|" >> "$SUMMARY_FILE"
            echo "| Total Coverage | $TOTAL |" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"

            echo "| Package | Coverage |" >> "$SUMMARY_FILE"
            echo "|---------|----------|" >> "$SUMMARY_FILE"

            go tool cover -func=coverage/coverage.out | grep -E "^[^/]" | while read line; do
              PKG=$(echo "$line" | awk '{print $1}')
              COV=$(echo "$line" | awk '{print $NF}')
              echo "| $PKG | $COV |" >> "$SUMMARY_FILE"
            done

            echo "" >> "$SUMMARY_FILE"
            echo "> See coverage artifact for details" >> "$SUMMARY_FILE"
          else
            echo "> No coverage report generated" >> "$SUMMARY_FILE"
            echo "::error::Coverage report generation failed"
            exit 1
          fi

          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-summary
          path: go-coverage-summary.md
          retention-days: 1

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: coverage/
          retention-days: 14

  # ==================== Go Build ====================
  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -o golem ./cmd/golem
          echo "Build successful: $(du -h golem | cut -f1)"

      - name: Verify binary
        run: |
          ./golem version
          ./golem --help

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: golem-binary
          path: golem
          retention-days: 1

  # ==================== Security Check ====================
  security:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -rE "(api[_-]?key|apikey|secret|password|token)\s*[=:]\s*['\"][^'\"]{10,}['\"]" \
            --include="*.go" --include="*.yaml" --include="*.yml" --include="*.json" \
            --exclude-dir="vendor" --exclude-dir=".git" \
            --exclude="*.test.*" --exclude="*_test.go" \
            .; then
            echo "::error::Found hardcoded secrets, use environment variables or config files"
            exit 1
          fi
          echo "::notice::No hardcoded secrets found"

      - name: Check sensitive files
        run: |
          echo "Checking for sensitive files..."
          SENSITIVE_FILES=(
            ".env"
            ".env.local"
            ".env.production"
            "*.pem"
            "*.key"
            "secrets.json"
            "credentials.json"
          )

          for file in "${SENSITIVE_FILES[@]}"; do
            if ls $file 2>/dev/null | grep -q .; then
              echo "::error::Found sensitive file: $file, please add to .gitignore"
              exit 1
            fi
          done
          echo "::notice::No sensitive files found"

      - name: Go dependency audit
        if: always()
        continue-on-error: true
        run: |
          echo "Checking Go dependencies..."
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::Go dependencies may have vulnerabilities"

  # ==================== Quality Gate Script ====================
  quality-gate:
    name: Quality Gate Script
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run quality gate script
        run: |
          chmod +x test.sh
          bash test.sh

  # ==================== Gate Result Summary ====================
  gate-result:
    name: Gate Result
    runs-on: ubuntu-latest
    needs: [go-fmt, go-vet, go-test, go-build, security, quality-gate]
    if: always()

    steps:
      - name: Download coverage summary
        uses: actions/download-artifact@v4
        if: always()
        with:
          name: go-coverage-summary
          path: coverage-artifacts
        continue-on-error: true

      - name: Check gate results
        run: |
          echo "============================================"
          echo "  Golem CI Gate Result"
          echo "============================================"
          echo ""

          GO_FMT="${{ needs.go-fmt.result }}"
          GO_VET="${{ needs.go-vet.result }}"
          GO_TEST="${{ needs.go-test.result }}"
          GO_BUILD="${{ needs.go-build.result }}"
          SECURITY_RESULT="${{ needs.security.result }}"
          QUALITY_GATE="${{ needs.quality-gate.result }}"

          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| Go Format | $GO_FMT |"
          echo "| Go Vet | $GO_VET |"
          echo "| Go Tests & Coverage | $GO_TEST |"
          echo "| Go Build | $GO_BUILD |"
          echo "| Security Check | $SECURITY_RESULT |"
          echo "| Quality Gate Script | $QUALITY_GATE |"
          echo ""

          if [ -f coverage-artifacts/go-coverage-summary.md ]; then
            echo "---"
            cat coverage-artifacts/go-coverage-summary.md
            echo ""
          fi

          if [[ "$GO_FMT" == "success" && \
                "$GO_VET" == "success" && \
                "$GO_TEST" == "success" && \
                "$GO_BUILD" == "success" && \
                "$SECURITY_RESULT" == "success" && \
                "$QUALITY_GATE" == "success" ]]; then
            echo "All gate checks passed!"
            exit 0
          else
            echo "Gate checks failed, please fix the issues above"
            exit 1
          fi

      - name: PR gate status comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const results = {
              'Go Format': '${{ needs.go-fmt.result }}',
              'Go Vet': '${{ needs.go-vet.result }}',
              'Go Tests & Coverage': '${{ needs.go-test.result }}',
              'Go Build': '${{ needs.go-build.result }}',
              'Security Check': '${{ needs.security.result }}',
              'Quality Gate Script': '${{ needs.quality-gate.result }}',
            };

            const statusEmoji = (status) => status === 'success' ? '✅' : (status === 'skipped' ? '⏭️' : '❌');

            let tableRows = Object.entries(results).map(([name, status]) =>
              `| ${name} | ${statusEmoji(status)} ${status} |`
            ).join('\n');

            const allPassed = Object.values(results).every(r => r === 'success');

            let coverageSection = '';
            try {
              const goCov = fs.readFileSync('coverage-artifacts/go-coverage-summary.md', 'utf8');
              coverageSection += '\n' + goCov + '\n';
            } catch (e) {}

            const body = `## Gate Check Result

            | Check | Status |
            |-------|--------|
            ${tableRows}
            ${coverageSection}
            ${allPassed
              ? '### All checks passed, ready to merge\n\n> Click **Squash and merge** to merge this PR'
              : '### Some checks failed, please fix and resubmit'}
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Gate Check Result')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
