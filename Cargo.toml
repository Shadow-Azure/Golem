[workspace]
resolver = "2"
members = [
    "crates/golem-core",
    "crates/golem-cli",
    "crates/golem-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Shadow-Azure/Golem"

[workspace.dependencies]
golem-core = { path = "crates/golem-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
